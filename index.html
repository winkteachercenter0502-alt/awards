const IMAGE_FOLDER = "templates";
const IMAGE_EXTS = ["jpeg", "jpg", "png"];

const canvas = document.getElementById("certCanvas");
const ctx = canvas.getContext("2d");
const renderStatus = document.getElementById("renderStatus");
const imgStatusEl = document.getElementById("imgStatus");

let currentAward = AWARD_TEMPLATES[0];
const imageCache = {};

function tryLoadImage(id){
  if(imageCache[id] !== undefined) return Promise.resolve(imageCache[id]);
  return new Promise((resolve) => {
    let i = 0;
    function attempt(){
      if(i >= IMAGE_EXTS.length){ imageCache[id] = null; resolve(null); return; }
      const src = `${IMAGE_FOLDER}/${id}.${IMAGE_EXTS[i]}`;
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => { imageCache[id] = img; resolve(img); };
      img.onerror = () => { i++; attempt(); };
      img.src = src;
    }
    attempt();
  });
}

/* ---------- 이름을 빈칸 너비에 맞춰 자동으로 폰트 크기 축소 ---------- */
function fitNameFont(ctx, text, maxWidth, baseSize){
  let size = baseSize;
  ctx.font = `700 ${size}px 'Gowun Dodum'`;
  while(ctx.measureText(text).width > maxWidth && size > baseSize * 0.45){
    size -= 1;
    ctx.font = `700 ${size}px 'Gowun Dodum'`;
  }
  return size;
}

/* ---------- 메인 렌더 함수 ---------- */
async function render(){
  const name = document.getElementById("childName").value.trim();
  const a = currentAward;

  const img = await tryLoadImage(a.id);

  const baseW = img ? img.naturalWidth  : 718;
  const baseH = img ? img.naturalHeight : 1024;
  const SCALE = 2; // 텍스트 선명도를 위해 2배 업스케일하여 렌더링
  canvas.width = baseW * SCALE;
  canvas.height = baseH * SCALE;
  const W = canvas.width, H = canvas.height;

  ctx.clearRect(0,0,W,H);

  if(img){
    ctx.drawImage(img, 0, 0, W, H);
  } else {
    drawFallbackBackground(ctx, W, H, a.accent, a.name);
  }

  if(name){
    const spot = a.nameSpot;
    const x = W * spot.xPct/100;
    const y = H * spot.yPct/100;
    const maxWidth = W * spot.maxWidthPct/100;
    const baseSize = Math.round(H*0.026);
    const size = fitNameFont(ctx, name, maxWidth, baseSize);
    ctx.font = `700 ${size}px 'Gowun Dodum'`;
    ctx.fillStyle = spot.color;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(name, x, y);
  }

  renderStatus.textContent = img
    ? `템플릿: templates/${a.id}.(jpeg|png) 사용 중 · ${baseW}×${baseH}px`
    : `templates/${a.id} 이미지를 찾지 못해 기본 파스텔 배경으로 대체했습니다.`;

  document.getElementById("scriptBody").textContent = a.body;
  document.getElementById("scriptWhisper").textContent = "🎁 선생님의 속삭임 " + a.whisper;
}

function drawFallbackBackground(ctx, W, H, accent, title){
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, "#FFF9E9");
  grad.addColorStop(1, "#EAFBF3");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  roundRect(W*0.04, H*0.03, W*0.92, H*0.94, W*0.05);
  ctx.strokeStyle = accent;
  ctx.lineWidth = W*0.012;
  ctx.stroke();
  ctx.font = `700 ${Math.round(H*0.032)}px 'Jua'`;
  ctx.fillStyle = accent;
  ctx.textAlign = "center";
  ctx.fillText("CATS ENGLISH", W/2, H*0.1);
  ctx.font = `700 ${Math.round(H*0.05)}px 'Jua'`;
  ctx.fillText(title, W/2, H*0.18);
  ["✨","⭐","🐾","✨"].forEach((e,idx)=>{
    ctx.font = `${Math.round(H*0.03)}px sans-serif`;
    const pos = [[0.1,0.08],[0.9,0.08],[0.1,0.95],[0.9,0.95]][idx];
    ctx.fillText(e, W*pos[0], H*pos[1]);
  });
}

/* ---------- 사이드바 카드 ---------- */
function buildAwardGrid(){
  const groups = {
    before: document.getElementById("group-before"),
    after: document.getElementById("group-after"),
    retention: document.getElementById("group-retention")
  };
  AWARD_TEMPLATES.forEach(a => {
    const card = document.createElement("div");
    card.className = "award-card";
    card.dataset.id = a.id;
    card.style.setProperty("--ac", a.accent);
    card.innerHTML = `
      <div class="swatch"></div>
      <div class="name">${a.name}</div>
      <div class="sub">${a.sub}</div>
      <span class="tag" data-tagfor="${a.id}">확인 중…</span>
    `;
    card.addEventListener("click", () => selectAward(a.id));
    groups[a.category].appendChild(card);
  });
}

function selectAward(id){
  currentAward = AWARD_TEMPLATES.find(a => a.id === id);
  document.querySelectorAll(".award-card").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  render();
}

async function refreshTags(){
  let anyFound = false;
  for(const a of AWARD_TEMPLATES){
    const img = await tryLoadImage(a.id);
    const tagEl = document.querySelector(`.tag[data-tagfor="${a.id}"]`);
    if(img){
      tagEl.textContent = "이미지 연결됨";
      tagEl.className = "tag ok";
      anyFound = true;
    } else {
      tagEl.textContent = "이미지 없음(기본배경)";
      tagEl.className = "tag na";
    }
  }
  imgStatusEl.innerHTML = anyFound
    ? `<b>templates/</b> 폴더의 이미지가 연결되었습니다. 이미지가 없는 상장은 기본 파스텔 배경으로 자동 대체됩니다.`
    : `<b>templates/</b> 폴더를 찾을 수 없어 모든 상장이 기본 파스텔 배경으로 표시됩니다.`;
}

/* ---------- 초기화 ---------- */
buildAwardGrid();
document.querySelector(`.award-card[data-id="${currentAward.id}"]`).classList.add("active");
document.getElementById("childName").addEventListener("input", render);

document.fonts.load("700 20px 'Gowun Dodum'").then(()=>document.fonts.load("700 20px 'Jua'")).finally(()=>{
  render();
  refreshTags();
});

/* ---------- 다운로드 ---------- */
document.getElementById("pngBtn").addEventListener("click", () => {
  const name = document.getElementById("childName").value.trim() || "아이이름";
  const link = document.createElement("a");
  link.download = `${currentAward.name}_${name}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
});

document.getElementById("pdfBtn").addEventListener("click", () => {
  const { jsPDF } = window.jspdf;
  const w = canvas.width, h = canvas.height;
  const orientation = w > h ? "l" : "p";
  const pdf = new jsPDF({ orientation, unit: "px", format: [w, h] });
  pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, w, h);
  const name = document.getElementById("childName").value.trim() || "아이이름";
  pdf.save(`${currentAward.name}_${name}.pdf`);
});
</script>
